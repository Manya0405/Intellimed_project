<!DOCTYPE html>
<html>
<head>

    <title>IntelliMed</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
        }

        header {
            background: #1f4e79;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        h2 {
            color: #1f4e79;
        }

        img {
            width: 100%;
            max-width: 700px;
            border-radius: 8px;
        }

        input {
            padding: 12px;
            width: 60%;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            background: #1f4e79;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #163a5c;
        }

        #medicineResult {
            margin-top: 20px;
            padding: 15px;
            background: #eef5fb;
            border-radius: 8px;
        }

    </style>

</head>

<body>

<header>

    <h1>IntelliMed</h1>

    <p>AI Based Medicine Assistance System</p>

</header>


<div class="container">


    <!-- AI DETECTION -->

    <div class="card">

        <h2>AI Object + Gesture Detection</h2>

        <img src="/combined-camera">

    </div>


    <!-- OCR -->

    <div class="card">

        <h2>Medicine Text Recognition</h2>

        <img src="/ocr-camera">

    </div>


    <!-- MEDICINE INFORMATION -->

    <div class="card">

        <h2>Medicine Information</h2>

        <input
            type="text"
            id="medicineName"
            placeholder="Enter medicine name"
        >

        <button onclick="getMedicineInfo()">
            Get Information
        </button>


        <div id="medicineResult">

            Medicine information will appear here.

        </div>

    </div>


</div>


<script>

async function getMedicineInfo() {

    const medicineName =
        document.getElementById("medicineName").value;

    if (!medicineName) {

        alert("Please enter a medicine name");

        return;
    }


    const response = await fetch("/medicine-info", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            medicine: medicineName
        })

    });


    const data = await response.json();


    document.getElementById("medicineResult").innerHTML = `

        <h3>${data.name}</h3>

        <p><b>Use:</b> ${data.use}</p>

        <p><b>Form:</b> ${data.form}</p>

    `;

}

</script>


</body>
</html>
